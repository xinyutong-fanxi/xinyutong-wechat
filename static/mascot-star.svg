<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset="0.5" stop-color="#F6F0FF"/>
      <stop offset="1" stop-color="#FFF7E8"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF2A8"/>
      <stop offset="1" stop-color="#FFD36E"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B102033" />
    </filter>
  </defs>

  <!-- Background sticker -->
  <rect x="24" y="24" width="432" height="312" rx="32" fill="url(#bg)" />

  <!-- Sparkles -->
  <g opacity="0.6" fill="#7C3AED">
    <circle cx="92" cy="98" r="6"/>
    <circle cx="126" cy="76" r="4"/>
    <circle cx="392" cy="94" r="5"/>
    <circle cx="360" cy="132" r="4"/>
  </g>
  <g opacity="0.45" fill="#2563EB">
    <circle cx="110" cy="250" r="5"/>
    <circle cx="84" cy="274" r="3.5"/>
    <circle cx="400" cy="244" r="4.5"/>
  </g>

  <!-- Friendly star mascot -->
  <g filter="url(#softShadow)">
    <path d="M240 88
             L271 147
             L336 158
             L288 206
             L299 272
             L240 242
             L181 272
             L192 206
             L144 158
             L209 147 Z"
          fill="url(#star)" stroke="#F59E0B" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Face -->
  <g>
    <circle cx="212" cy="182" r="9" fill="#1F2937"/>
    <circle cx="268" cy="182" r="9" fill="#1F2937"/>
    <path d="M214 208 C228 224, 252 224, 266 208" fill="none" stroke="#1F2937" stroke-width="6" stroke-linecap="round"/>
    <!-- Cheeks -->
    <ellipse cx="194" cy="202" rx="14" ry="9" fill="#FB7185" opacity="0.35"/>
    <ellipse cx="286" cy="202" rx="14" ry="9" fill="#FB7185" opacity="0.35"/>
  </g>

  <!-- Bottom caption shape (no text; app supplies text) -->
  <path d="M108 286
           C150 250, 330 250, 372 286
           C336 312, 144 312, 108 286 Z"
        fill="#FFFFFF" opacity="0.65"/>
</svg>
