# Local-only AI overrides (NOT a committed default)
#
# This repo supports a safe default where no AI provider is configured,
# and cloud functions return a stub assistant response.
#
# To enable an LLM, copy:
# - `cloudfunctions/shared/ai.properties.example` → `cloudfunctions/shared/ai.properties`
# Then edit values (or set env vars in your runtime).
#
# If you leave AI_PROVIDER unset, the server will use the stub fallback.
#
# Example (local Ollama):
# AI_PROVIDER=ollama
# AI_BASE_URL=http://127.0.0.1:11434/v1
# AI_MODEL=llama3.1
# AI_API_KEY=

